[project]
name = "soi"
version = "0.1.0"
description = "Fetch, store and visualize CPC Southern Oscillation Index (SOI) data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "plotnine>=0.14",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
soi = "soi.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/soi"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate (commented code)
    "PLC", # pylint convention
    "PLE", # pylint error
    "PLR", # pylint refactor
    "PLW", # pylint warning
    "RUF", # ruff-specific rules
    "TCH", # flake8-type-checking
]
ignore = ["B008"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ERA001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
required-version = ">=0.6.0"
compile-bytecode = true

[tool.pyrefly]
python_version = "3.13"
python_platform = "linux"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
